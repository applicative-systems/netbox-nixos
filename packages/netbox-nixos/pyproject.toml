[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-nixos"
version = "0.1.0"
description = "serve netbox as a nix flake"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
netbox-nixos = "netbox_nixos:main"

[tool.setuptools]
py-modules = ["netbox_nixos"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
